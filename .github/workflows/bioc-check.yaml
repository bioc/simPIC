name: BiocCheck

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]

jobs:
  BiocCheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install BiocCheck
        run: |
          install.packages("BiocManager")
          BiocManager::install("BiocCheck")
      - name: Run BiocCheck
        run: |
          Rscript -e "BiocCheck::BiocCheck('.')"